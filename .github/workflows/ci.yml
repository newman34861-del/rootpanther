name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, rules and frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Typecheck every project
        run: npm run typecheck

      # The house rules are enforced here rather than by review: no em dashes, no
      # marketing copy, no colour values outside the theme.
      - name: House rules
        run: npm run check:rules

      - name: Build both frontends
        run: npm run build

      - name: Build the API
        run: npm run build -w @rootpanther/api

  test:
    name: API tests against Postgres
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # The suite brings up its own Postgres, creates the production role shape and runs
      # the migrations, so CI runs the same path a developer runs. A service container
      # and a column of env vars here would be a second setup to keep in step with the
      # first, and the two would drift.
      - name: Test
        working-directory: apps/api
        run: npx vitest run

  terraform:
    name: Terraform validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Format
        working-directory: infra
        run: terraform fmt -check -recursive

      # No backend and no credentials: this checks the configuration is sound without
      # touching state or the subscription. Plan and apply are a separate, gated step.
      - name: Validate
        working-directory: infra
        run: |
          terraform init -backend=false -input=false
          terraform validate
